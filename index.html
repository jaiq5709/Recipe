<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나만의 레시피 북 | 9개 카테고리 컬렉션</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f5;
      --surface: #ffffff;
      --surface-alt: #f3efe9;
      --primary: #c85a32;
      --primary-light: #fdf1ec;
      --primary-dark: #9e4120;
      --text: #22201e;
      --text-muted: #68625c;
      --border: #e6dfd5;
      --shadow: 0 4px 18px rgba(34, 32, 30, 0.06);
      --shadow-hover: 0 10px 28px rgba(34, 32, 30, 0.12);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* Header & Hero */
    header {
      background: linear-gradient(135deg, #2c241e 0%, #44352b 100%);
      color: #fff;
      padding: 44px 20px 36px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 20%, rgba(200, 90, 50, 0.25), transparent 60%);
      pointer-events: none;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.14);
      color: #ffd7c7;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }

    header h1 {
      font-size: clamp(1.75rem, 3.5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    header p {
      color: #d8cfc6;
      font-size: 0.98rem;
      max-width: 580px;
      margin: 0 auto 24px;
    }

    /* Search Bar */
    .search-box {
      max-width: 520px;
      margin: 0 auto;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 14px 48px 14px 20px;
      border-radius: 999px;
      border: none;
      font-size: 0.95rem;
      font-family: inherit;
      background: #fff;
      color: var(--text);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
      outline: none;
      transition: box-shadow 0.2s;
    }

    .search-box input:focus {
      box-shadow: 0 0 0 3px rgba(200, 90, 50, 0.45), 0 6px 20px rgba(0, 0, 0, 0.18);
    }

    .search-box button {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
    }

    .search-box button.visible {
      display: block;
    }

    /* Sticky Category Nav */
    .nav-wrapper {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250, 248, 245, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .category-tabs {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 2px;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 0 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 8px 15px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 3px 10px rgba(200, 90, 50, 0.25);
    }

    .tab-count {
      font-size: 0.75rem;
      opacity: 0.85;
      background: rgba(0, 0, 0, 0.08);
      padding: 1px 6px;
      border-radius: 999px;
    }

    .tab-btn.active .tab-count {
      background: rgba(255, 255, 255, 0.22);
    }

    /* Main Container */
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      font-size: 0.9rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 10px;
    }

    .stats-bar strong {
      color: var(--primary);
      font-weight: 700;
    }

    .view-controls {
      display: flex;
      gap: 8px;
    }

    .toggle-all-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }

    .toggle-all-btn:hover {
      background: var(--surface-alt);
    }

    /* Category Section */
    .category-section {
      margin-bottom: 52px;
      scroll-margin-top: 76px;
    }

    .category-banner {
      display: grid;
      grid-template-columns: 220px 1fr;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .category-img-wrap {
      position: relative;
      min-height: 145px;
      background: #e9e2d8;
      overflow: hidden;
    }

    .category-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .category-banner:hover .category-img-wrap img {
      transform: scale(1.04);
    }

    .category-info {
      padding: 22px 26px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .category-num {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .category-info h2 {
      font-size: 1.45rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--text);
    }

    .category-info p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Recipe Grid */
    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 20px;
    }

    /* Recipe Card */
    .recipe-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .recipe-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }

    .card-thumb {
      width: 100%;
      height: 170px;
      object-fit: cover;
      background: var(--surface-alt);
      display: block;
    }

    .card-body {
      padding: 20px 22px 22px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
    }

    .sub-tag {
      flex-shrink: 0;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--primary-light);
      color: var(--primary-dark);
      padding: 3px 9px;
      border-radius: 6px;
    }

    .ingredients-box {
      background: var(--surface-alt);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 0.87rem;
    }

    .section-label {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }

    .ingredients-text {
      color: #3c3834;
      line-height: 1.55;
    }

    .steps-box {
      font-size: 0.91rem;
      color: #2f2c29;
      flex: 1;
    }

    .steps-list {
      padding-left: 18px;
      margin-top: 4px;
    }

    .steps-list li {
      margin-bottom: 6px;
    }

    .steps-list li:last-child {
      margin-bottom: 0;
    }

    .single-step {
      margin-top: 4px;
      line-height: 1.65;
    }

    .empty-state {
      text-align: center;
      padding: 64px 20px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      display: none;
    }

    .empty-state h3 {
      font-size: 1.2rem;
      margin-bottom: 6px;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    footer {
      text-align: center;
      padding: 28px 20px;
      color: var(--text-muted);
      font-size: 0.84rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    @media (max-width: 680px) {
      .category-banner {
        grid-template-columns: 1fr;
      }
      .category-img-wrap {
        height: 160px;
      }
      .recipe-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <span class="badge">PERSONAL RECIPE ARCHIVE</span>
      <h1>나만의 실전 레시피 북</h1>
      <p>검증된 황금비율과 해보고 싶은 핵심 레시피를 9개 카테고리로 정리한 요리 아카이브</p>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="요리명, 식재료(예: 삼겹살, 마늘, 새우, 버터) 검색..." />
        <button id="clearSearch" title="검색어 지우기">✕</button>
      </div>
    </div>
  </header>

  <div class="nav-wrapper">
    <nav class="category-tabs" id="categoryTabs">
      <button class="tab-btn active" data-cat="all">전체 보기 <span class="tab-count" id="totalCount">0</span></button>
    </nav>
  </div>

  <main>
    <div class="stats-bar">
      <div>현재 표시된 레시피: <strong id="visibleCount">0</strong>개</div>
      <div class="view-controls">
        <button class="toggle-all-btn" id="toggleImagesBtn">대표 이미지 숨기기</button>
      </div>
    </div>

    <div id="recipeContainer"></div>

    <div class="empty-state" id="emptyState">
      <h3>일치하는 레시피가 없습니다</h3>
      <p>다른 재료명이나 요리 이름으로 다시 검색해 보세요.</p>
    </div>
  </main>

  <footer>
    레시피.pdf 기반 개인 요리 아카이브 · 오프라인 단독 실행 지원 HTML
  </footer>

  <script>
    // SVG 데이터 URI 생성기 (외부 네트워크 끊김 없이 선명한 일러스트 대표 이미지 제공)
    function makeFoodIllustration(bg1, bg2, emoji, label) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="${bg1}"/>
              <stop offset="100%" stop-color="${bg2}"/>
            </linearGradient>
          </defs>
          <rect width="600" height="340" fill="url(#g)"/>
          <circle cx="510" cy="60" r="95" fill="rgba(255,255,255,0.08)"/>
          <circle cx="90" cy="290" r="110" fill="rgba(255,255,255,0.07)"/>
          <circle cx="300" cy="148" r="76" fill="rgba(255,255,255,0.18)"/>
          <text x="300" y="168" font-size="74" text-anchor="middle" dominant-baseline="middle">${emoji}</text>
          <text x="300" y="266" font-family="sans-serif" font-size="22" font-weight="700" fill="rgba(255,255,255,0.92)" text-anchor="middle" letter-spacing="1">${label}</text>
        </svg>`;
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg.trim());
    }

    const recipeData = [
      {
        id: "cat-1",
        num: "CATEGORY 01",

        desc: "볶음밥, 솥밥, 덮밥, 비빔밥까지 든든하게 한 끼를 완성하는 메인 밥 요리",
        image: makeFoodIllustration("#d97724", "#9a4412", "🍚", "RICE & ONE-BOWL MEALS"),
        recipes: [
          {
            name: "마늘 볶음밥 (2인분)",

            steps: [
              "통마늘을 으깨 다지고 간 마늘은 키친타월로 물기를 뺍니다.",

              "진간장을 기름 쪽에 눌리듯 볶고 불을 끈 뒤 맛소금과 밥을 고루 섞습니다.",
              "버터를 넣고 강불에서 골고루 볶아 완성합니다."
            ]
          },
          {
            name: "피씨방 김치볶음밥",
            tag: "볶음밥",
            emoji: "🍳",
            colors: ["#d94e34", "#8f2414"],
            ingredients: "밥, 대파, 스팸, 김치, 고춧가루 1, 설탕 1/2, 간장 1, 다시다 1/2, 마요네즈 1, 참기름, 달걀",
            steps: [
              "파기름에 스팸과 김치를 볶다가 고춧가루 1, 설탕 1/2을 넣고 약불에 볶습니다.",
              "간장 1을 팬 가장자리에 태우듯 두르고 밥을 넣어 섞습니다.",

            steps: [

              "표고버섯을 올려 솥밥을 지은 후 구운 생선살 등을 곁들여 비벼 먹습니다."
            ]
          },
          {
            name: "부타동 (타레 소스)",

            steps: [
              "간장·미림·청주·물이 끓으면 불을 끄고 다시마와 가쓰오부시를 넣어 식힙니다.",

            ]
          },
          {

            steps: [
              "새콤달콤하게 무친 무생채와 향긋한 부추무침을 준비합니다.",

            ]
          }
        ]
      },
      {

        image: makeFoodIllustration("#c84b31", "#7a2312", "🥘", "SOUPS, STEWS & HOT POTS"),
        recipes: [
          {
            name: "감자짜글이",
            tag: "찌개·짜글이",
            emoji: "🥔",
            colors: ["#cf5736", "#872a12"],
            ingredients: "감자 2개(400g), 통조림햄 1캔(200g), 양파 1/2개, 대파 1컵, 청양고추 3개, 간마늘 1큰술, 된장 1/2큰술, 고추장 1큰술, 굵은고춧가루 2큰술, 설탕 1큰술, 진간장 4큰술, 물 4컵(700g)",
            steps: [

              "끓어오르면 약불로 줄여 국물이 반으로 졸아들고 감자가 으깨질 때까지 끓입니다."
            ]
          },
          {
            name: "고깃집 스타일 된장찌개",
            tag: "찌개",
            emoji: "🍲",
            colors: ["#9e5b2b", "#5c3010"],
            ingredients: "된장 3, 쌈장 3, 고추장 1, 물 2컵, 애호박 1/4, 양파 1/4, 두부 1/2, 팽이버섯, 대파, 다시다 1/2T, 차돌박이 등 고기, 식용유",
            steps: [
              "식용유에 된장 3, 쌈장 3을 볶다 고추장 1을 넣고 함께 볶습니다.",
              "물 2컵을 붓고 끓으면 애호박, 양파, 두부, 팽이버섯, 대파, 다시다 1/2T, 차돌박이를 넣어 끓입니다."
            ]
          },
          {
            name: "닭전골",

              "메쉬드 포테이토: 으깬 감자 3개에 생크림, 우유, 마요네즈, 설탕을 넣고 부드럽게 섞어 완성합니다."
            ]
          },
          {
            name: "크림 스피니치",
            tag: "사이드 디쉬",
            emoji: "🥬",
            colors: ["#47874b", "#204d23"],
            ingredients: "데친 시금치, 버터 4T, 다진 양파 1C, 다진 마늘 1T, 밀가루 3T, 우유 2C, 파마산 치즈, 넛맥, 소금, 후추",
            steps: [
              "데친 시금치의 물기를 꼭 짠 뒤 잘게 썹니다.",
              "버터 4T에 다진 양파 1C, 다진 마늘 1T를 볶다가 밀가루 3T, 우유 2C를 넣고 걸쭉하게 졸인 뒤 시금치와 파마산 치즈, 넛맥, 소금, 후추를 넣어 완성합니다."
            ]
          },
          {
            name: "코울슬로",
            tag: "샐러드",
            emoji: "🥗",
            colors: ["#6fa34b", "#395e1f"],
            ingredients: "다진 양배추, 소금, 생크림, 레몬즙, 후추, 파르미지아노 레지아노 치즈",
            steps: [
              "다진 양배추를 소금에 30분 절여 물기를 꽉 짜냅니다.",
              "생크림, 레몬즙, 후추, 파르미지아노 레지아노 치즈를 넣고 상큼하게 버무립니다."
            ]
          },
          {
            name: "감자치즈케이크",
            tag: "디저트",
            emoji: "🍰",
            colors: ["#d49a35", "#825912"],
            ingredients: "감자 2개, 소금, 버터 30g, 달걀 2개, 우유 30ml, 치즈",
            steps: [
              "깍둑썬 감자 2개를 소금에 살짝 절여 전자레인지에 6분 돌린 뒤 곱게 으깹니다.",
              "버터 30g, 달걀 2개, 우유 30ml를 섞어 틀에 담고 180도에서 25분 구운 후 치즈를 얹어 녹입니다."
            ]
          }
        ]
      }
    ];

    const tabsEl = document.getElementById("categoryTabs");
    const containerEl = document.getElementById("recipeContainer");
    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearch");
    const totalCountEl = document.getElementById("totalCount");
    const visibleCountEl = document.getElementById("visibleCount");
    const emptyStateEl = document.getElementById("emptyState");
    const toggleImagesBtn = document.getElementById("toggleImagesBtn");

    let activeCategory = "all";
    let showImages = true;

    // 초기 탭 및 총 개수 세팅
    const totalRecipes = recipeData.reduce((acc, cat) => acc + cat.recipes.length, 0);
    totalCountEl.textContent = totalRecipes;

    recipeData.forEach((cat, idx) => {
      const btn = document.createElement("button");
      btn.className = "tab-btn";
      btn.dataset.cat = cat.id;
      btn.innerHTML = `${idx + 1}. ${cat.title} <span class="tab-count">${cat.recipes.length}</span>`;
      tabsEl.appendChild(btn);
    });

    function renderRecipes() {
      const keyword = searchInput.value.trim().toLowerCase();
      containerEl.innerHTML = "";
      let count = 0;

      recipeData.forEach(cat => {
        if (activeCategory !== "all" && activeCategory !== cat.id) return;

        const filtered = cat.recipes.filter(r => {
          if (!keyword) return true;
          const haystack = [r.name, r.tag, r.ingredients, ...r.steps, cat.title].join(" ").toLowerCase();
          return haystack.includes(keyword);
        });

        if (filtered.length === 0) return;
        count += filtered.length;

        const section = document.createElement("section");
        section.className = "category-section";
        section.id = cat.id;

        section.innerHTML = `
          <div class="category-banner">
            <div class="category-img-wrap" style="${showImages ? "" : "display:none;"}">
              <img src="${cat.image}" alt="${cat.title} 대표 이미지" loading="lazy" />
            </div>
            <div class="category-info" style="${showImages ? "" : "grid-column: 1 / -1;"}">
              <span class="category-num">${cat.num} · ${filtered.length}개의 레시피</span>
              <h2>${cat.title}</h2>
              <p>${cat.desc}</p>
            </div>
          </div>
          <div class="recipe-grid">
            ${filtered.map(r => {
              const thumbSrc = makeFoodIllustration(r.colors[0], r.colors[1], r.emoji, r.name);
              const stepsHtml = r.steps.length > 1
                ? `<ol class="steps-list">${r.steps.map(s => `<li>${s}</li>`).join("")}</ol>`
                : `<p class="single-step">${r.steps[0]}</p>`;

              return `
                <article class="recipe-card">
                  ${showImages ? `<img class="card-thumb" src="${thumbSrc}" alt="${r.name}" loading="lazy" />` : ""}
                  <div class="card-body">
                    <div class="card-header">
                      <h3 class="card-title">${r.name}</h3>
                      <span class="sub-tag">${r.tag}</span>
                    </div>
                    <div class="ingredients-box">
                      <span class="section-label">재료 및 양념</span>
                      <p class="ingredients-text">${r.ingredients}</p>
                    </div>
                    <div class="steps-box">
                      <span class="section-label">조리법</span>
                      ${stepsHtml}
                    </div>
                  </div>
                </article>
              `;
            }).join("")}
          </div>
        `;
        containerEl.appendChild(section);
      });

      visibleCountEl.textContent = count;
      emptyStateEl.style.display = count === 0 ? "block" : "none";
      clearSearchBtn.classList.toggle("visible", keyword.length > 0);
    }

    tabsEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeCategory = btn.dataset.cat;
      renderRecipes();
      window.scrollTo({ top: document.querySelector(".nav-wrapper").offsetTop, behavior: "smooth" });
    });

    searchInput.addEventListener("input", renderRecipes);

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      renderRecipes();
      searchInput.focus();
    });

    toggleImagesBtn.addEventListener("click", () => {
      showImages = !showImages;
      toggleImagesBtn.textContent = showImages ? "대표 이미지 숨기기" : "대표 이미지 보기";
      renderRecipes();
    });

    renderRecipes();
  </script>
</body>
</html>
